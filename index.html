<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#080808;color:#e8e8e8;font-family:'Courier New',monospace;padding-bottom:80px;min-height:100dvh}
::-webkit-scrollbar{display:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.page{display:none;padding:24px 16px}
.page.active{display:block}
.card{background:#101010;border:1px solid #1c1c1c;border-radius:8px;padding:14px 16px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:3px;color:#555;margin-bottom:4px;display:block}
.inp{background:#141414;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;font-family:inherit;font-size:13px;padding:10px 12px;width:100%;outline:none}
.btn{background:#2a2a2a;color:#e8e8e8;border:none;border-radius:6px;padding:8px 14px;font-family:inherit;font-size:11px;letter-spacing:2px;cursor:pointer;font-weight:bold}
.btn-gold{background:#FFD700;color:#000}
.btn-red{background:#CC0000;color:#fff;text-decoration:none;display:inline-block}
.btn-sm{padding:5px 10px;font-size:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,.97);border-top:1px solid #1c1c1c;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav button{flex:1;background:none;border:none;color:#555;cursor:pointer;padding:10px 4px 8px;font-family:inherit;font-size:9px;letter-spacing:1.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.active{color:#FFD700}
.nav button span.icon{font-size:16px}
.nav-bar{width:16px;height:2px;border-radius:1px;background:#FFD700;margin-top:1px;display:none}
.nav button.active .nav-bar{display:block}
.ex-card{background:#101010;border:1px solid #1c1c1c;border-left:3px solid #2a2a2a;border-radius:8px;padding:14px 16px;margin-bottom:10px;transition:opacity .2s}
.ex-card.done{opacity:.6;border-left-color:var(--day-color);background:#0c0c0c}
.ex-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;cursor:pointer}
.ex-name{font-size:14px;font-weight:bold;margin-bottom:4px}
.ex-card.done .ex-name{text-decoration:line-through;color:#555}
.ex-notes{font-size:11px;color:#555}
.ex-sets{font-size:13px;font-weight:bold;letter-spacing:1px;color:var(--day-color)}
.ex-card.done .ex-sets{color:#333}
.check-box{width:20px;height:20px;border:1px solid #333;border-radius:3px;margin-top:6px;margin-left:auto;display:flex;align-items:center;justify-content:center;font-size:11px}
.ex-card.done .check-box{border-color:var(--day-color);background:rgba(255,255,255,.1);color:var(--day-color)}
.ex-bottom{margin-top:10px;padding-top:10px;border-top:1px solid #1c1c1c;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log-form{margin-top:10px}
.day-tabs{display:flex;overflow-x:auto;border-bottom:1px solid #1c1c1c;margin:0 -16px;padding:0 16px;scrollbar-width:none}

.day-tab.active{color:var(--day-color);border-bottom-color:var(--day-color)}
.day-dot{position:absolute;top:4px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--day-color);display:none}
.prog-bar-wrap{margin-bottom:20px}
.prog-bar-info{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#555;margin-bottom:5px}
.prog-bar-bg{height:3px;background:#1c1c1c;border-radius:2px}
.prog-bar-fill{height:100%;border-radius:2px;transition:width .3s;background:var(--day-color)}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 14px}
.divider-line{height:1px;flex:1;background:#1c1c1c}
.divider-text{font-size:10px;letter-spacing:4px;color:#555}
.sect{font-size:10px;letter-spacing:4px;color:#555;margin:20px 0 10px}

// -- DATE HELPERS --
function getWeekKey(d){
  d=d||new Date();
  var u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dy=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-dy);
  var ys=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  var wn=Math.ceil((((u-ys)/86400000)+1)/7);
  return u.getUTCFullYear()+"-W"+(wn<10?"0":"")+wn;
}
function getTodayKey(){
  var d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();
}
function getTodayName(){
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return days[new Date().getDay()];
}

// -- WEIGHT PROGRESSION --
function getSugW(id,sw,inc){
  var h=(ld("weights",{})[id]||[]);
  if(!h.length) return sw;
  var l=h[h.length-1];
  return l.allComplete ? Math.round((l.weight+inc)*4)/4 : l.weight;
}
function saveWLog(id,weight,allComplete){
  var all=ld("weights",{});
  if(!all[id]) all[id]=[];
  all[id].push({date:getTodayKey(),weight:weight,allComplete:allComplete});
  if(all[id].length>60) all[id].shift();
  sv("weights",all);
}

// -- TAB SWITCHING --
var currentTab = "workout";
function showTab(name){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".nav button").forEach(function(b){b.classList.remove("active");});
  document.getElementById(name).classList.add("active");
  document.getElementById("nav-"+name).classList.add("active");
  currentTab = name;
  if(name==="workout") renderWorkout();
  else if(name==="calories") renderCalories();
  else if(name==="progress") renderProgress();
  else if(name==="history") renderHistory();
  else if(name==="coach") renderCoach();
}

// -- WORKOUT TAB --

var weekKey = getWeekKey();
var checked = ld("checked_"+weekKey,{});

function saveChecked(){ sv("checked_"+weekKey, checked); }

  var exs = BASE[activeDay];
  var color = meta.color;
  var all = exs.main.concat(exs.core);
  var total = all.length;
  var done = 0;
  for(var i=0;i<all.length;i++){ if(checked[activeDay+"-"+i]) done++; }
  var pct = total ? Math.round((done/total)*100) : 0;

  var html = '<div style="--day-color:'+color+'">';
  // Header
  html += '<div style="padding:24px 0 16px;border-bottom:1px solid #1c1c1c">';
  html += '<div style="font-size:10px;letter-spacing:4px;color:#555;margin-bottom:4px">WEEKLY TRAINING - '+weekKey+'</div>';
  html += '<div style="display:flex;align-items:center;gap:12px">';
  html += '<div style="font-size:clamp(28px,8vw,44px);font-weight:900;letter-spacing:3px;color:'+color+';line-height:1">'+meta.label+'</div>';
  html += '<div><div style="font-size:11px;color:#555;letter-spacing:2px">'+activeDay.toUpperCase()+'</div>';
  html += '<div style="font-size:12px;color:#888">'+meta.tagline+'</div></div></div></div>';

  // Day tabs
  html += '<div class="day-tabs">';
  var icons = {PUSH:"^",LEGS:"*",PULL:"v",REST:"o"};
  for(var d=0;d<DAYS.length;d++){
    var day = DAYS[d];
    var m = META[day];
    var isActive = day===activeDay;
    var isToday = day===getTodayName();
    html += '<button class="day-tab'+(isActive?" active":"")+'" style="--day-color:'+m.color+'" onclick="switchDay(\''+day+'\')">';
    if(isToday) html += '<div class="day-dot" style="display:block"></div>';
    html += '<span style="font-size:13px">'+(icons[m.label]||"o")+'</span>';
    html += '<span>'+day.slice(0,3).toUpperCase()+'</span></button>';
  }
  html += '</div>';

  // Progress bar
  if(meta.label !== "REST"){
    html += '<div class="prog-bar-wrap" style="margin-top:16px">';
    html += '<div class="prog-bar-info"><span>SESSION PROGRESS</span><span style="color:'+(pct===100?color:"#555")+'">'+done+'/'+total+' DONE</span></div>';
    html += '<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  }

  // Main exercises
  for(var i=0;i<exs.main.length;i++){
    html += renderExCard(exs.main[i], i, color, false);
  }

  // Core finisher
  if(exs.core.length > 0){
    html += '<div class="divider"><div class="divider-line"></div><span class="divider-text">CORE FINISHER</span><div class="divider-line"></div></div>';
    for(var i=0;i<exs.core.length;i++){
      html += renderExCard(exs.core[i], exs.main.length+i, "#FFD700", true);
    }
  }

  html += '</div>';
  document.getElementById("workout").innerHTML = '<div style="padding:0 16px">'+html+'</div>';
}

function renderExCard(ex, idx, color, isCore){
  var key = activeDay+"-"+idx;
  var done = !!checked[key];
  var sugW = getSugW(ex.id, ex.sw, ex.inc);
  var hist = (ld("weights",{})[ex.id]||[]).slice(-6);
  var ac = isCore ? "#FFD700" : color;

  var html = '<div class="ex-card'+(done?" done":"")+'" style="--day-color:'+ac+';border-left-color:'+(done?ac:"#2a2a2a")+'">';
  html += '<div class="ex-top" onclick="toggleCheck(\''+activeDay+'\','+idx+')">';
  html += '<div><div class="ex-name">'+ex.name+'</div><div class="ex-notes">'+ex.notes+'</div></div>';
  html += '<div style="text-align:right">';
  html += '<div class="ex-sets" style="color:'+(done?"#333":ac)+'">'+ex.sets+'x'+ex.reps+'</div>';
  html += '<div class="check-box" style="border-color:'+(done?ac:"#333")+';color:'+ac+'">'+(done?"v":"")+'</div>';
  html += '</div></div>';

  // Bottom row
  html += '<div class="ex-bottom">';
  html += '<a href="'+ytUrl(ex.id)+'" target="_blank" class="btn btn-red btn-sm">YT</a>';
  if(ex.sw > 0){
    html += '<span style="font-size:10px;letter-spacing:2px;color:#555">SUGGEST:</span>';
    html += '<span style="font-size:13px;color:'+ac+';font-weight:bold">'+sugW+'lbs</span>';
    html += '<button class="btn btn-sm" style="margin-left:auto" onclick="toggleLog(\''+ex.id+'\','+idx+',\''+activeDay+'\')">LOG</button>';
  }
  html += '</div>';

  // Log form (hidden by default, shown via toggleLog)
  html += '<div id="logform-'+activeDay+'-'+idx+'" style="display:none;margin-top:10px">';
  html += '<label class="lbl">WEIGHT USED (lbs)</label>';
  html += '<input class="inp" type="number" id="loginput-'+activeDay+'-'+idx+'" value="'+sugW+'" style="margin-bottom:8px"/>';
  html += '<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#555;margin-bottom:10px;cursor:pointer">';
  html += '<input type="checkbox" id="logcheck-'+activeDay+'-'+idx+'"/> Completed all sets at this weight</label>';
  if(hist.length > 0){
    html += '<div class="lbl">RECENT</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
    for(var h=0;h<hist.length;h++){
      html += '<div style="font-size:11px;color:'+(hist[h].allComplete?ac:"#555")+';background:#1c1c1c;border-radius:4px;padding:3px 7px">'+hist[h].weight+'lbs'+(hist[h].allComplete?" v":"")+'</div>';
    }
    html += '</div>';
  }
  html += '<button class="btn btn-sm" style="background:'+ac+';color:#000;width:100%;padding:10px" onclick="saveLog(\''+ex.id+'\','+idx+',\''+activeDay+'\')">SAVE LOG</button>';
  html += '</div>';

  html += '</div>';
  return html;
}

function switchDay(day){
  activeDay = day;
  renderWorkout();
}

function toggleCheck(day, idx){
  var key = day+"-"+idx;
  checked[key] = !checked[key];
  saveChecked();
  renderWorkout();
}

function toggleLog(id, idx, day){
  var form = document.getElementById("logform-"+day+"-"+idx);

}

function saveLog(id, idx, day){
  var input = document.getElementById("loginput-"+day+"-"+idx);
  var checkEl = document.getElementById("logcheck-"+day+"-"+idx);

  if(form) form.style.display = "none";

}

var calActiveDate = getTodayKey();

function renderCalories(){
  var todayKey = getTodayKey();
  var calLog = ld("cal_"+todayKey, []);

  var html = '';

  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);last7.push(d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate());}

  html += '<div class="cal-bar-wrap"><div class="cal-bar-fill'+(over?" over":"")+'" style="width:'+pct+'%"></div></div>';
  html += '<div class="macro-row">';
  html += '<div class="macro-item"><div class="macro-label">PROTEIN</div><div class="macro-val" style="color:#FF4D1C">'+tot.p+'g</div></div>';
  html += '<div class="macro-item"><div class="macro-label">CARBS</div><div class="macro-val" style="color:#1C8AFF">'+tot.c+'g</div></div>';
  html += '<div class="macro-item"><div class="macro-label">FAT</div><div class="macro-val" style="color:#FFD700">'+tot.f+'g</div></div>';
  html += '</div></div>';

  // Log entries
  if(viewLog.length > 0){
    html += '<div class="sect">LOG</div>';
    for(var i=0;i<viewLog.length;i++){
      var e=viewLog[i];
      html += '<div class="card log-item">';
      html += '<div><div style="font-size:13px;font-weight:bold">'+e.name+'</div>';
      html += '<div style="font-size:11px;color:#555">'+e.p+'g P / '+e.c+'g C / '+e.f+'g F</div></div>';

      html += '</div></div>';

  // Add food (today only)
  if(calActiveDate === todayKey){
    html += '<div class="sect">ADD FOOD</div>';

function editCalGoal(){
  var el = document.getElementById("goal-edit");

}
function saveCalGoal(){
  var v = parseInt(document.getElementById("goal-input").value)||2500;
  sv("cal_goal", v);

function switchCalDate(d){
  calActiveDate = d;
  renderCalories();

function filterFoods(){
  var q = document.getElementById("food-search").value.toLowerCase();
  var res = document.getElementById("food-results");
  if(!q){res.style.display="none";return;}
  var filtered = FOODS.filter(function(f){return f.name.toLowerCase().indexOf(q)>=0;});
  if(!filtered.length){res.innerHTML='<div style="padding:12px;color:#555;font-size:12px;text-align:center">No results</div>';res.style.display="block";return;}
  var html="";
  for(var i=0;i<filtered.length;i++){
    var f=filtered[i];
    html+='<div class="food-item" onclick="addFood('+i+',\''+q+'\')">';
    html+='<div><div class="food-name">'+f.name+'</div><div class="food-macros">'+f.p+'g P / '+f.c+'g C / '+f.f+'g F</div></div>';
    html+='<span class="food-cal">'+f.cal+'</span></div>';
  }
  res.innerHTML=html; res.style.display="block";
}
function addFood(idx, q){
  var filtered = FOODS.filter(function(f){return f.name.toLowerCase().indexOf(q)>=0;});
  var f = filtered[idx];
  if(!f) return;
  var todayKey = getTodayKey();
  var log = ld("cal_"+todayKey,[]);
  log.push({id:Date.now(),name:f.name,cal:f.cal,p:f.p,c:f.c,f:f.f});
  sv("cal_"+todayKey, log);
  renderCalories();
}
function addCustomFood(){
  var name=document.getElementById("cf-name").value;
  var cal=parseInt(document.getElementById("cf-cal").value)||0;
  var p=parseInt(document.getElementById("cf-p").value)||0;
  var c=parseInt(document.getElementById("cf-c").value)||0;
  var f=parseInt(document.getElementById("cf-f").value)||0;
  if(!name||!cal) return;
  var todayKey=getTodayKey();
  var log=ld("cal_"+todayKey,[]);
  log.push({id:Date.now(),name:name,cal:cal,p:p,c:c,f:f});
  sv("cal_"+todayKey,log);
  renderCalories();
}
function removeCalItem(id){
  var todayKey=getTodayKey();
  var log=ld("cal_"+todayKey,[]).filter(function(e){return e.id!==id;});
  sv("cal_"+todayKey,log);
  renderCalories();
}

var selExId = null;
function renderProgress(){
  var allEx=[];
  var seen={};
  var dkeys=Object.keys(BASE);
  for(var d=0;d<dkeys.length;d++){
    var day=BASE[dkeys[d]];
    var exs=day.main.concat(day.core);
    for(var i=0;i<exs.length;i++){
      if(exs[i].sw>0&&!seen[exs[i].id]){seen[exs[i].id]=true;allEx.push(exs[i]);}
    }
  }
  if(!selExId && allEx.length) selExId=allEx[0].id;
  var ex=null;
  for(var i=0;i<allEx.length;i++){if(allEx[i].id===selExId){ex=allEx[i];break;}}
  var hist=ex?(ld("weights",{})[selExId]||[]):[];
  var maxW=0,last=null,first=null,gain=0;
  if(hist.length){
    for(var i=0;i<hist.length;i++) if(hist[i].weight>maxW) maxW=hist[i].weight;
    last=hist[hist.length-1]; first=hist[0]; gain=last.weight-first.weight;
  }

  var html='';
  html+='<div style="font-size:10px;letter-spacing:4px;color:#555;margin-bottom:4px">WEIGHT TRACKING</div>';
  html+='<div style="font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:3px;margin-bottom:20px">PROGRESSION</div>';
  html+='<div style="margin-bottom:20px"><label class="lbl">EXERCISE</label>';
  html+='<select onchange="switchExercise(this.value)">';
  for(var i=0;i<allEx.length;i++){
    html+='<option value="'+allEx[i].id+'"'+(allEx[i].id===selExId?" selected":"")+'>'+allEx[i].name+'</option>';
  }
  html+='</select></div>';

  if(ex){
    html+='<div class="grid3">';
    html+='<div class="stat-card"><div class="stat-label">CURRENT</div><div class="stat-val" style="color:#FFD700">'+(last?last.weight+"lbs":"--")+'</div></div>';
    html+='<div class="stat-card"><div class="stat-label">PR</div><div class="stat-val" style="color:#FF4D1C">'+(maxW?maxW+"lbs":"--")+'</div></div>';
    html+='<div class="stat-card"><div class="stat-label">TOTAL GAIN</div><div class="stat-val" style="color:#00C76A">'+(gain?"+"+gain+"lbs":"--")+'</div></div>';
    html+='</div>';
    if(hist.length){
      html+='<div class="sect">HISTORY (last '+hist.length+')</div>';
      var rev=[].concat(hist).reverse();
      for(var i=0;i<rev.length;i++){
        html+='<div class="hist-entry"><span style="font-size:11px;color:#555">'+rev[i].date+'</span>';
        html+='<span style="font-size:14px;font-weight:bold;color:'+(rev[i].allComplete?"#FFD700":"#555")+'">'+rev[i].weight+' lbs'+(rev[i].allComplete?" v":"")+'</span></div>';
      }
    } else {
      html+='<div style="color:#555;font-size:13px;margin-top:20px;text-align:center">No logs yet. Use the LOG button in the Workout tab.</div>';
    }
  }
  document.getElementById("progress").innerHTML=html;
}
function switchExercise(id){ selExId=id; renderProgress(); }

function renderHistory(){
  var keys=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(PFX+"checked_")===0) keys.push(k.replace(PFX+"checked_",""));

  keys.sort().reverse();
  var html='';

  html+='<div style="font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:3px;margin-bottom:20px">PAST WEEKS</div>';
  if(!keys.length){
    html+='<div style="color:#555;font-size:13px;margin-top:40px;text-align:center">No history yet - complete your first workout!</div>';
  } else {
    html+='<div style="margin-bottom:20px"><label class="lbl">SELECT WEEK</label><select onchange="renderHistoryWeek(this.value)" id="week-sel">';
    for(var i=0;i<keys.length;i++){
      html+='<option value="'+keys[i]+'"'+(keys[i]===getWeekKey()?' selected':'')+'>'+keys[i]+(keys[i]===getWeekKey()?" (current)":"")+'</option>';
    }
    html+='</select></div><div id="history-week-detail"></div>';
  }
  document.getElementById("history").innerHTML=html;
  if(keys.length) renderHistoryWeek(keys[0]);
}
function renderHistoryWeek(wk){
  var data=ld("checked_"+wk,{});
  var total=Object.keys(data).length;
  var done=0;
  for(var k in data) if(data[k]) done++;
  var byDay={};
  for(var k in data){
    var day=k.split("-")[0];
    if(!byDay[day]) byDay[day]={total:0,done:0};
    byDay[day].total++;
    if(data[k]) byDay[day].done++;
  }
  var pctAll=total?Math.round((done/total)*100):0;
  var html='<div class="card" style="border-left:3px solid #FFD700">';
  html+='<div style="font-size:10px;letter-spacing:3px;color:#555;margin-bottom:8px">WEEK OVERVIEW</div>';
  html+='<div style="font-size:32px;font-weight:900;color:#FFD700">'+pctAll+'%</div>';
  html+='<div style="font-size:12px;color:#555">'+done+'/'+total+' exercises completed</div></div>';
  html+='<div class="sect">BY DAY</div>';
  for(var d=0;d<DAYS.length;d++){
    var day=DAYS[d];
    if(!byDay[day]) continue;
    var m=META[day];
    var dd=byDay[day];
    var pct=dd.total?Math.round((dd.done/dd.total)*100):0;
    html+='<div class="card" style="border-left:3px solid '+m.color+'">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    html+='<div><span style="color:'+m.color+';font-weight:bold;font-size:13px">'+day+'</span>';
    html+='<span style="color:#555;font-size:11px;margin-left:8px">'+m.label+'</span></div>';
    html+='<span style="color:'+(pct===100?m.color:"#555")+';font-size:13px;font-weight:bold">'+pct+'%</span></div>';
    html+='<div style="height:2px;background:#1c1c1c;border-radius:1px">';
    html+='<div style="height:100%;width:'+pct+'%;background:'+m.color+';border-radius:1px"></div></div></div>';
  }
  var el=document.getElementById("history-week-detail");
  if(el) el.innerHTML=html;
}

function buildCtx(){
  var wk=getWeekKey();
  var tk=getTodayKey();
  var tcal=ld("cal_"+tk,[]);
  var cals=0,prot=0;
  for(var i=0;i<tcal.length;i++){cals+=tcal[i].cal;prot+=tcal[i].p;}
  var goal=ld("cal_goal",2500);
  var wts=ld("weights",{});
  var prs=[];
  var ids=Object.keys(wts).slice(0,5);
  for(var i=0;i<ids.length;i++){
    var id=ids[i];
    var h=wts[id];
    if(!h||!h.length) continue;
    var ex=null;
    var dkeys=Object.keys(BASE);
    for(var d=0;d<dkeys.length&&!ex;d++){
      var exs=BASE[dkeys[d]].main.concat(BASE[dkeys[d]].core);
      for(var j=0;j<exs.length;j++){if(exs[j].id===id){ex=exs[j];break;}}
    }
    if(!ex) continue;
    var maxW=0;
    for(var j=0;j<h.length;j++) if(h[j].weight>maxW) maxW=h[j].weight;
    prs.push(ex.name+": "+maxW+"lbs");
  }
  return "User context: Week="+wk+" Today="+getTodayName()+" ("+META[getTodayName()].label+" day). Calories today: "+cals+"/"+goal+" kcal, Protein: "+prot+"g. PRs: "+(prs.join(", ")||"none yet")+". Split: Push(Mon/Fri) Legs(Tue) Pull(Wed/Sat) Rest(Thu/Sun).";
}
async function sendChat(){
  var input=document.getElementById("chat-input");
  if(!input||!input.value.trim()||chatLoading) return;
  var txt=input.value.trim();
  input.value="";
  chatMsgs.push({role:"user",content:txt});
  chatLoading=true;
  renderCoach();
  try{
    var resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:600,
        system:"You are a direct personal trainer and nutrition coach in a PPL workout app. "+buildCtx()+" Be concise and actionable. Use short bullet points. Format for a phone screen.",
        messages:chatMsgs.map(function(m){return{role:m.role,content:m.content};})
      })
    });
    var data=await resp.json();
    var text=(data.content&&data.content[0]&&data.content[0].text)||"Sorry, could not get a response.";
    chatMsgs.push({role:"assistant",content:text});
  } catch(e){
    chatMsgs.push({role:"assistant",content:"Network error - check your connection."});
  }
  chatLoading=false;
  renderCoach();
}

showTab("workout");
