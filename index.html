// ── STORAGE ──
const PFX="pplfit3_";
const sv=(k,v)=>{try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch{}};
const ld=(k,fb=null)=>{try{const v=localStorage.getItem(PFX+k);return v!==null?JSON.parse(v):fb}catch{return fb}};
function getWeekKey(d=new Date()){const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dy=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-dy);const ys=new Date(Date.UTC(u.getUTCFullYear(),0,1));const wn=Math.ceil((((u-ys)/86400000)+1)/7);return`${u.getUTCFullYear()}-W${String(wn).padStart(2,"0")}`;}
function getTodayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function getTodayName(){const d=new Date().getDay();return DAYS[d===0?6:d-1];}

// ── WEIGHT LOGIC ──
function getSugW(id,sw,inc){const h=(ld("weights",{})[id]||[]);if(!h.length)return sw;const l=h[h.length-1];return l.allComplete?Math.round((l.weight+inc)*4)/4:l.weight;}
function saveWLog(id,weight,allComplete){const all=ld("weights",{});if(!all[id])all[id]=[];all[id].push({date:getTodayKey(),weight,allComplete});if(all[id].length>60)all[id].shift();sv("weights",all);}
function getWHist(id){return(ld("weights",{})[id]||[]).slice(-8);}

// ── SHARED STYLES ──
const inp={background:"#141414",border:"1px solid #2a2a2a",borderRadius:6,color:"#e8e8e8",fontFamily:C.font,fontSize:13,padding:"10px 12px",width:"100%",outline:"none"};
const lbl={fontSize:10,letterSpacing:3,color:C.muted,marginBottom:4,display:"block"};
const btn=(bg="#2a2a2a",fg="#e8e8e8")=>({background:bg,color:fg,border:"none",borderRadius:6,padding:"10px 18px",fontFamily:C.font,fontSize:11,letterSpacing:2,cursor:"pointer",fontWeight:"bold"});
const card={background:C.surf,border:`1px solid ${C.brd}`,borderRadius:8,padding:"14px 16px",marginBottom:10};

// ── EXERCISE CARD ──
function ExCard({ex,checked,onToggle,color,isCore}){
  const [showLog,setShowLog]=useState(false);
  const [weight,setWeight]=useState(()=>String(getSugW(ex.id,ex.sw,ex.inc)));
  const [allSets,setAllSets]=useState(false);
  const hist=getWHist(ex.id);
  const done=!!checked;
  const ac=isCore?C.gold:color;
  function handleLog(){const w=parseFloat(weight)||0;saveWLog(ex.id,w,allSets);setShowLog(false);}
  return React.createElement("div",{style:{background:done?"#0c0c0c":C.surf,border:`1px solid ${done?ac+"33":C.brd}`,borderLeft:`3px solid ${done?ac:C.brd2}`,borderRadius:8,padding:"14px 16px",marginBottom:10,opacity:done?.6:1,transition:"all .2s"}},
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr auto",gap:10,alignItems:"start",cursor:"pointer"},onClick:onToggle},
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:14,fontWeight:"bold",color:done?C.muted:C.text,textDecoration:done?"line-through":"none",marginBottom:4}},ex.name),
        React.createElement("div",{style:{fontSize:11,color:C.muted}},ex.notes)
      ),
      React.createElement("div",{style:{textAlign:"right",flexShrink:0}},
        React.createElement("div",{style:{fontSize:13,color:done?C.faint:ac,fontWeight:"bold",letterSpacing:1}},`${ex.sets}×${ex.reps}`),
        React.createElement("div",{style:{marginTop:6,width:20,height:20,border:`1px solid ${done?ac:C.faint}`,borderRadius:3,background:done?ac+"22":"transparent",marginLeft:"auto",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:done?ac:C.faint}},done?"✓":"")
      )
    ),
    ex.sw>0&&React.createElement("div",{style:{marginTop:10,borderTop:`1px solid ${C.brd}`,paddingTop:10}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        React.createElement("span",{style:{fontSize:10,letterSpacing:2,color:C.muted}},"SUGGESTED:"),
        React.createElement("span",{style:{fontSize:13,color:ac,fontWeight:"bold"}},`${getSugW(ex.id,ex.sw,ex.inc)} lbs`),
        React.createElement("button",{onClick:()=>setShowLog(!showLog),style:{...btn(),padding:"4px 10px",fontSize:10,marginLeft:"auto"}},showLog?"CANCEL":"LOG")
      ),
      showLog&&React.createElement("div",{style:{marginTop:10}},
        React.createElement("label",{style:lbl},"WEIGHT USED (lbs)"),
        React.createElement("input",{style:{...inp,marginBottom:8},type:"number",value:weight,onChange:e=>setWeight(e.target.value)}),
        React.createElement("label",{style:{display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.muted,marginBottom:10,cursor:"pointer"}},
          React.createElement("input",{type:"checkbox",checked:allSets,onChange:e=>setAllSets(e.target.checked)}),
          "Completed all sets at this weight"
        ),
        hist.length>0&&React.createElement("div",{style:{marginBottom:10}},
          React.createElement("div",{style:lbl},"RECENT"),
          React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            hist.map((h,i)=>React.createElement("div",{key:i,style:{fontSize:11,color:h.allComplete?ac:C.muted,background:C.brd,borderRadius:4,padding:"3px 7px"}},`${h.weight}lbs${h.allComplete?" ✓":""}`)
          ))
        ),
        React.createElement("button",{onClick:handleLog,style:{...btn(ac,"#000"),width:"100%",padding:10}},"SAVE LOG")
      )
    )
  );
}

// ── WORKOUT TAB ──
function WorkoutTab(){
  const today=getTodayName();
  const [activeDay,setActiveDay]=useState(today);
  const wk=getWeekKey();
  const [checked,setChecked]=useState(()=>ld(`checked_${wk}`,{}));
  useEffect(()=>{sv(`checked_${wk}`,checked);},[checked,wk]);
  const meta=META[activeDay];
  const exs=BASE[activeDay];
  const all=[...exs.main,...exs.core];
  const total=all.length;
  const done=all.filter((_,i)=>checked[`${activeDay}-${i}`]).length;
  const pct=total?Math.round((done/total)*100):0;
  function toggle(i){setChecked(p=>({...p,[`${activeDay}-${i}`]:!p[`${activeDay}-${i}`]}));}
  return React.createElement("div",{style:{padding:"0 16px"}},
    React.createElement("div",{style:{padding:"24px 0 16px",borderBottom:`1px solid ${C.brd}`}},
      React.createElement("div",{style:{fontSize:10,letterSpacing:4,color:C.muted,marginBottom:4}},`WEEKLY TRAINING — ${wk}`),
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12}},
        React.createElement("div",{style:{fontSize:"clamp(28px,8vw,44px)",fontWeight:900,letterSpacing:3,color:meta.theme,lineHeight:1}},meta.label),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:11,color:C.muted,letterSpacing:2}},activeDay.toUpperCase()),
          React.createElement("div",{style:{fontSize:12,color:"#888"}},meta.tagline)
        )
      )
    ),
    React.createElement("div",{style:{display:"flex",overflowX:"auto",gap:0,margin:"0 -16px",padding:"0 16px",scrollbarWidth:"none",borderBottom:`1px solid ${C.brd}`}},
      DAYS.map(d=>{const m=META[d];const isA=d===activeDay;const isT=d===today;return React.createElement("button",{key:d,onClick:()=>setActiveDay(d),style:{flexShrink:0,padding:"12px 12px",background:"none",border:"none",borderBottom:`2px solid ${isA?m.theme:"transparent"}`,color:isA?m.theme:C.muted,cursor:"pointer",fontSize:9,letterSpacing:1,fontFamily:C.font,display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}},
        isT&&React.createElement("div",{style:{position:"absolute",top:4,right:3,width:4,height:4,borderRadius:"50%",background:m.theme}}),
        React.createElement("span",{style:{fontSize:13}},m.label==="PUSH"?"↑":m.label==="LEGS"?"◈":m.label==="PULL"?"↓":"○"),
        React.createElement("span",null,d.slice(0,3).toUpperCase())
      );})
    ),
    React.createElement("div",{style:{paddingTop:16}},
      meta.label!=="REST"&&React.createElement("div",{style:{marginBottom:20}},
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,letterSpacing:2,color:C.muted,marginBottom:5}},
          React.createElement("span",null,"SESSION PROGRESS"),
          React.createElement("span",{style:{color:pct===100?meta.theme:C.muted}},`${done}/${total} DONE`)
        ),
        React.createElement("div",{style:{height:3,background:C.brd,borderRadius:2}},
          React.createElement("div",{style:{height:"100%",width:`${pct}%`,background:meta.theme,borderRadius:2,transition:"width .3s"}})
        )
      ),
      exs.main.map((ex,i)=>React.createElement(ExCard,{key:ex.id+i,ex,checked:checked[`${activeDay}-${i}`],onToggle:()=>toggle(i),color:meta.theme,isCore:false})),
      exs.core.length>0&&React.createElement(React.Fragment,null,
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,margin:"20px 0 14px"}},
          React.createElement("div",{style:{height:1,flex:1,background:C.brd}}),
          React.createElement("span",{style:{fontSize:10,letterSpacing:4,color:C.muted}},"CORE FINISHER"),
          React.createElement("div",{style:{height:1,flex:1,background:C.brd}})
        ),
        exs.core.map((ex,i)=>{const gi=exs.main.length+i;return React.createElement(ExCard,{key:ex.id+i,ex,checked:checked[`${activeDay}-${gi}`],onToggle:()=>toggle(gi),color:meta.theme,isCore:true});})
      )
    )
  );
}

// ── HISTORY TAB ──
function HistoryTab(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX+"checked_"))keys.push(k.replace(PFX+"checked_",""));}
  keys.sort().reverse();
  const [sel,setSel]=useState(keys[0]||getWeekKey());
  const data=ld(`checked_${sel}`,{});
  const total=Object.keys(data).length;
  const done=Object.values(data).filter(Boolean).length;
  const byDay={};
  Object.entries(data).forEach(([k,v])=>{const[day]=k.split("-");if(!byDay[day])byDay[day]={total:0,done:0};byDay[day].total++;if(v)byDay[day].done++;});
  return React.createElement("div",{style:{padding:"24px 16px"}},
    React.createElement("div",{style:{fontSize:10,letterSpacing:4,color:C.muted,marginBottom:4}},"TRAINING HISTORY"),
    React.createElement("div",{style:{fontSize:"clamp(24px,7vw,40px)",fontWeight:900,letterSpacing:3,marginBottom:20}},"PAST WEEKS"),
    keys.length===0&&React.createElement("div",{style:{color:C.muted,fontSize:13,marginTop:40,textAlign:"center"}},"No history yet — complete your first workout!"),
    keys.length>0&&React.createElement(React.Fragment,null,
      React.createElement("div",{style:{marginBottom:20}},
        React.createElement("label",{style:lbl},"SELECT WEEK"),
        React.createElement("select",{value:sel,onChange:e=>setSel(e.target.value),style:inp},
          keys.map(k=>React.createElement("option",{key:k,value:k},k+(k===getWeekKey()?" (current)":"")))
        )
      ),

    ),

        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:32,fontWeight:900,color:pct>=100?"#FF4D1C":C.gold}},tot.cal),
          React.createElement("div",{style:{fontSize:11,color:C.muted}},`of ${goal} kcal`)

        React.createElement("div",{style:{textAlign:"right"}},
          React.createElement("div",{style:{fontSize:11,color:C.muted}},"remaining"),

      ),

// ── COACH TAB ──
function CoachTab(){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Hey! I'm your AI training coach. Ask me anything — exercise form, progressive overload, nutrition, plateaus, or recovery. What's on your mind?"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);
  function buildCtx(){
    const wk=getWeekKey();
    const chk=ld(`checked_${wk}`,{});
    const wts=ld("weights",{});
    const tk=getTodayKey();
    const tcal=ld(`cal_${tk}`,[]).reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p}),{cal:0,p:0});
    const calGoal=ld("cal_goal",2500);
    const prs=Object.entries(wts).slice(0,6).map(([id,h])=>{
      const ex=Object.values(BASE).flatMap(d=>[...d.main,...d.core]).find(e=>e.id===id);
      if(!ex||!h.length)return null;
      return`${ex.name}: ${Math.max(...h.map(x=>x.weight))}lbs`;
    }).filter(Boolean).join(", ");
    return`User training context:\n- Week: ${wk}, Today: ${getTodayName()} (${META[getTodayName()].label} day)\n- Calories today: ${tcal.cal}/${calGoal} kcal, Protein: ${tcal.p}g\n- Recent PRs: ${prs||"none logged yet"}\n- Split: Push(Mon/Fri), Legs(Tue/Sat), Pull(Wed/Sun), Rest(Thu)`;
  }
  async function send(){
    if(!input.trim()||loading)return;
    const userMsg={role:"user",content:input};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs);setInput("");setLoading(true);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system:`You are a direct, knowledgeable personal trainer and nutrition coach in a PPL workout app.\n${buildCtx()}\nBe concise and actionable. Use short bullet points. Format for a phone screen.`,
          messages:newMsgs.map(m=>({role:m.role,content:m.content})),
        }),
      });
      const data=await resp.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"Sorry, couldn't get a response.";
      setMsgs(p=>[...p,{role:"assistant",content:text}]);
    }catch(e){
      setMsgs(p=>[...p,{role:"assistant",content:"Network error — check your connection and try again."}]);
    }
    setLoading(false);
  }
  const quickPrompts=["How do I progress faster?","What should I eat today?","Fix my bench form","I hit a plateau","Best recovery tips","How much protein do I need?"];
  return React.createElement("div",{style:{padding:"24px 16px 0",display:"flex",flexDirection:"column",height:"calc(100dvh - 80px)"}},
    React.createElement("div",{style:{marginBottom:12}},
      React.createElement("div",{style:{fontSize:10,letterSpacing:4,color:C.muted,marginBottom:4}},"AI POWERED"),
      React.createElement("div",{style:{fontSize:"clamp(24px,7vw,40px)",fontWeight:900,letterSpacing:3,marginBottom:12}},"COACH")
    ),
    React.createElement("div",{style:{display:"flex",overflowX:"auto",gap:6,margin:"0 -16px 12px",padding:"0 16px",scrollbarWidth:"none",flexShrink:0}},
      quickPrompts.map(q=>React.createElement("button",{key:q,onClick:()=>setInput(q),style:{flexShrink:0,...btn(C.surf),border:`1px solid ${C.brd2}`,padding:"6px 12px",fontSize:10,color:C.muted,letterSpacing:1}},q))
    ),
    React.createElement("div",{style:{flex:1,overflowY:"auto",marginBottom:12,scrollbarWidth:"none"}},
      msgs.map((m,i)=>React.createElement("div",{key:i,style:{marginBottom:12,display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}},
        React.createElement("div",{style:{maxWidth:"85%",background:m.role==="user"?"#1a1a1a":C.surf,border:`1px solid ${m.role==="user"?C.brd2:C.brd}`,borderRadius:10,borderBottomRightRadius:m.role==="user"?2:10,borderBottomLeftRadius:m.role==="assistant"?2:10,padding:"10px 14px",fontSize:13,lineHeight:1.6,color:C.text,whiteSpace:"pre-wrap"}},m.content)
      )),
      loading&&React.createElement("div",{style:{display:"flex",gap:4,padding:"10px 14px",background:C.surf,borderRadius:10,width:"fit-content",border:`1px solid ${C.brd}`}},
        [0,1,2].map(i=>React.createElement("div",{key:i,style:{width:6,height:6,borderRadius:"50%",background:C.muted,animation:`pulse 1.2s ${i*0.2}s infinite`}}))
      ),
      React.createElement("div",{ref:bottomRef})
    ),
    React.createElement("div",{style:{display:"flex",gap:8,paddingBottom:12,flexShrink:0}},
      React.createElement("input",{style:{...inp,flex:1},placeholder:"Ask your coach...",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send()}),
      React.createElement("button",{onClick:send,disabled:loading,style:{...btn(C.gold,"#000"),flexShrink:0,padding:"10px 16px",opacity:loading?.5:1}},"↑")
    )
  );
}
