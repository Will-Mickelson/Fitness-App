function getWeekKey(d=new Date()){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dy=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-dy);
  const ys=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  const wn=Math.ceil((((u-ys)/86400000)+1)/7);
  return u.getUTCFullYear()+"-W"+String(wn).padStart(2,"0");
}
function getTodayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getTodayName(){const d=new Date().getDay();return DAYS[d===0?6:d-1];}

function saveWLog(id,weight,allComplete){const all=ld("weights",{});if(!all[id])all[id]=[];all[id].push({date:getTodayKey(),weight,allComplete});if(all[id].length>60)all[id].shift();sv("weights",all);}

function DemoModal({ex,color,onClose}){
  const [tick,setTick]=useState(0);

  useEffect(()=>{
    function animate(ts){
      if(!startRef.current)startRef.current=ts;
      setTick((ts-startRef.current)/600);
      rafRef.current=requestAnimationFrame(animate);
    }
    rafRef.current=requestAnimationFrame(animate);
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[]);
  const svg=getAnim(ex.id,tick,color);

function HistoryTab(){
  const keys=[];

// Coach Tab
function CoachTab(){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Hey! I'm your AI training coach. Ask me anything about form, progression, nutrition, or recovery."}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"});},[msgs,loading]);
  function buildCtx(){
    const wk=getWeekKey(),chk=ld("checked_"+wk,{}),tk=getTodayKey();
    const tcal=ld("cal_"+tk,[]).reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p}),{cal:0,p:0});
    const wts=ld("weights",{});
    const prs=Object.entries(wts).slice(0,5).map(([id,h])=>{
      const ex=Object.values(BASE).flatMap(d=>[...d.main,...d.core]).find(e=>e.id===id);
      return ex&&h.length?ex.name+": "+Math.max.apply(null,h.map(x=>x.weight))+"lbs PR":null;
    }).filter(Boolean).join(", ");
    return "User context:
- Week: "+wk+", Today: "+getTodayName()+" ("+META[getTodayName()].label+" day)
- Calories today: "+tcal.cal+"/"+ld("cal_goal",2500)+" kcal, Protein: "+tcal.p+"g
- Recent PRs: "+(prs||"none yet")+"
- Split: Push(Mon/Fri), Legs(Tue), Pull(Wed/Sat), Rest(Thu/Sun)";
  }
  async function send(){
    if(!input.trim()||loading)return;
    const userMsg={role:"user",content:input};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs);setInput("");setLoading(true);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",max_tokens:600,
          system:"You are a direct personal trainer and nutrition coach in a PPL workout app.
"+buildCtx()+"
Be concise, actionable, phone-screen friendly. Use short bullet points.",
          messages:newMsgs.map(m=>({role:m.role,content:m.content})),
        }),
      });
      const data=await resp.json();
      const text=(data.content&&data.content.find(b=>b.type==="text")&&data.content.find(b=>b.type==="text").text)||"Sorry, couldn't get a response.";
      setMsgs(p=>[...p,{role:"assistant",content:text}]);
    }catch(e){setMsgs(p=>[...p,{role:"assistant",content:"Network error - check your connection."}]);}
    setLoading(false);
  }
  const quick=["How do I progress faster?","What should I eat today?","Fix my bench form","I hit a plateau","Best recovery tips","How much protein?"];
  return React.createElement("div",{style:{padding:"24px 16px 0",display:"flex",flexDirection:"column",height:"calc(100dvh - 80px)"}},
    React.createElement("div",{style:{marginBottom:12}},
      React.createElement("div",{style:{fontSize:10,letterSpacing:4,color:C.muted,marginBottom:4}},"AI POWERED"),
      React.createElement("div",{style:{fontSize:"clamp(24px,7vw,40px)",fontWeight:900,letterSpacing:3,marginBottom:12}},"COACH")
    ),
    React.createElement("div",{style:{display:"flex",overflowX:"auto",gap:6,margin:"0 -16px 12px",padding:"0 16px",scrollbarWidth:"none",flexShrink:0}},
      quick.map(q=>React.createElement("button",{key:q,onClick:()=>setInput(q),style:{flexShrink:0,...mkbtn(C.surf),border:"1px solid "+C.brd2,padding:"6px 12px",fontSize:10,color:C.muted,letterSpacing:1}},q))
    ),
    React.createElement("div",{style:{flex:1,overflowY:"auto",marginBottom:12,scrollbarWidth:"none"}},
      msgs.map((m,i)=>React.createElement("div",{key:i,style:{marginBottom:12,display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}},
        React.createElement("div",{style:{maxWidth:"85%",background:m.role==="user"?"#1a1a1a":C.surf,border:"1px solid "+(m.role==="user"?C.brd2:C.brd),borderRadius:10,borderBottomRightRadius:m.role==="user"?2:10,borderBottomLeftRadius:m.role==="assistant"?2:10,padding:"10px 14px",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}},m.content)
      )),
      loading&&React.createElement("div",{style:{display:"flex",gap:4,padding:"10px 14px",background:C.surf,borderRadius:10,width:"fit-content",border:"1px solid "+C.brd}},
        [0,1,2].map(i=>React.createElement("div",{key:i,style:{width:6,height:6,borderRadius:"50%",background:C.muted,animation:"pulse 1.2s "+(i*0.2)+"s infinite"}}))
      ),
      React.createElement("div",{ref:bottomRef})
    ),
    React.createElement("div",{style:{display:"flex",gap:8,paddingBottom:12,flexShrink:0}},
      React.createElement("input",{style:{...inp,flex:1},placeholder:"Ask your coach...",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send()}),
      React.createElement("button",{onClick:send,disabled:loading,style:{...mkbtn(C.gold,"#000"),flexShrink:0,padding:"10px 16px",opacity:loading?.5:1}},"^")
    )
  );
}
